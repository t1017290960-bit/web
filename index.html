<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>救世軍 直播待機畫面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
    
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #0c0204;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }

    /* 背景柔光流動動畫 */
    .aurora-bg {
      position: absolute;
      inset: -50%;
      background: radial-gradient(circle at 50% 50%, rgba(185, 28, 28, 0.35) 0%, rgba(120, 15, 20, 0.2) 35%, rgba(15, 3, 5, 0.95) 70%, #080102 100%);
      filter: blur(60px);
      animation: rotateGradient 28s ease-in-out infinite alternate;
      z-index: 1;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: floatMotion 18s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, #e11d48, transparent 70%);
      top: 15%;
      left: 10%;
    }

    .blob-2 {
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, #991b1b, transparent 70%);
      bottom: 10%;
      right: 15%;
      animation-duration: 22s;
      animation-delay: -5s;
    }

    @keyframes rotateGradient {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }

    @keyframes floatMotion {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4vw, -5vh) scale(1.1); }
      100% { transform: translate(-3vw, 4vh) scale(0.95); }
    }

    /* 呼吸發光 Logo */
    .logo-glow {
      filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.45)) drop-shadow(0 0 70px rgba(185, 28, 28, 0.3));
      animation: breathingGlow 5s ease-in-out infinite;
    }

    @keyframes breathingGlow {
      0%, 100% {
        filter: drop-shadow(0 0 25px rgba(220, 38, 38, 0.4)) drop-shadow(0 0 60px rgba(185, 28, 28, 0.25));
        transform: translateY(0px) scale(1);
      }
      50% {
        filter: drop-shadow(0 0 45px rgba(239, 68, 68, 0.7)) drop-shadow(0 0 90px rgba(220, 38, 38, 0.5));
        transform: translateY(-6px) scale(1.015);
      }
    }

    /* 點陣動畫 */
    .dot-flashing {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot-flashing span {
      width: 8px;
      height: 8px;
      background-color: #f87171;
      border-radius: 50%;
      animation: pulseDot 1.4s infinite ease-in-out both;
    }

    .dot-flashing span:nth-child(1) { animation-delay: -0.32s; }
    .dot-flashing span:nth-child(2) { animation-delay: -0.16s; }
    .dot-flashing span:nth-child(3) { animation-delay: 0s; }

    @keyframes pulseDot {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.3); }
    }

    /* 掃光文字效果 */
    .shimmer-text {
      background: linear-gradient(90deg, #ffffff 0%, #fecaca 40%, #ffffff 50%, #fca5a5 60%, #ffffff 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: textShimmer 6s linear infinite;
    }

    @keyframes textShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body class="relative flex items-center justify-center">

  <!-- 背景動態光暈層 -->
  <div class="aurora-bg"></div>
  <div class="aurora-blob blob-1"></div>
  <div class="aurora-blob blob-2"></div>

  <!-- Canvas 粒子飄動層 -->
  <canvas id="particleCanvas" class="absolute inset-0 z-10 pointer-events-none w-full h-full"></canvas>

  <!-- 內容主舞台 (16:9 容器保證視覺平衡) -->
  <main class="relative z-20 flex flex-col items-center justify-center text-center px-6 max-w-5xl">
    
    <!-- 救世軍雙盾 Logo -->
    <div class="relative mb-8">
      <img 
        src="https://inskvcdsblyukxuqeqoz.supabase.co/storage/v1/object/sign/interactive-tools-bucket/user_3JToioDfZjv8bhcMCl8vBy2mapl/5b88845c-5c83-486a-8815-77e9114022dd.png?token=eyJraWQiOiI4MTYwZjkwMC1kYTUyLTQ5ZjEtYmYwOC04Y2JkMTgwNjcwMDUiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJpbnRlcmFjdGl2ZS10b29scy1idWNrZXQvdXNlcl8zSlRvaW9EZlpqdjhiaGNNQ2w4dkJ5Mm1hcGwvNWI4ODg0NWMtNWM4My00ODZhLTg4MTUtNzdlOTExNDAyMmRkLnBuZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTQ1NDc5MDksImV4cCI6MTc5NDU0ODIwOX0.ILNhUmx11LAGKyZDxFwHr7BxdjCRw8vdZS3J_kzsXno" 
        alt="救世軍 The Salvation Army"
        class="h-44 sm:h-52 md:h-64 object-contain logo-glow"
      />
    </div>

    <!-- 主標題：直播即將開始 -->
    <div class="space-y-3">
      <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded-full bg-red-950/70 border border-red-500/40 backdrop-blur-md mb-2 shadow-lg">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
        <span class="text-red-200 text-xs sm:text-sm tracking-widest font-semibold uppercase">LIVE BROADCAST</span>
      </div>

      <h1 id="mainTitle" class="text-3xl sm:text-5xl md:text-6xl font-black tracking-wider shimmer-text">
        直播即將開始
      </h1>

      <p id="subTitle" class="text-base sm:text-xl text-red-100/80 font-light tracking-widest pt-1">
        STREAM STARTING SOON
      </p>
    </div>

    <!-- 動態跳動點與即時時間 / 倒數器模組 -->
    <div class="mt-8 flex flex-col items-center gap-4">
      <div class="dot-flashing">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- 時間顯示卡片 (可設定為目前時間或倒數) -->
      <div id="timeContainer" class="flex items-center gap-3 text-red-200/90 text-sm sm:text-base font-mono tracking-wider bg-black/40 border border-red-500/30 px-6 py-2 rounded-xl backdrop-blur-md shadow-2xl">
        <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span id="displayClock">00:00:00</span>
      </div>
    </div>
  </main>

  <!-- 底部優雅品牌標語 -->
  <footer class="absolute bottom-6 z-20 text-xs sm:text-sm text-neutral-400/80 tracking-widest font-light flex items-center gap-2">
    <span>THE SALVATION ARMY</span>
    <span>•</span>
    <span>救世軍</span>
  </footer>

  <!-- 右下角控制面版 (預設隱藏，按鍵盤 H 鍵可隨時開啟/收合) -->
  <div id="controlPanel" class="hidden fixed top-4 right-4 z-50 transition-all duration-300">
    <div class="bg-neutral-900/90 border border-neutral-700/60 backdrop-blur-lg rounded-2xl p-4 text-xs text-white shadow-2xl flex flex-col gap-3 min-w-[210px]">
      <div class="flex items-center justify-between font-bold text-neutral-300 border-b border-neutral-700 pb-2">
        <span>直播畫面設定</span>
        <button id="toggleFullscreen" class="px-2 py-0.5 bg-neutral-800 hover:bg-neutral-700 rounded text-neutral-300 text-[10px]">全螢幕</button>
      </div>

      <div class="space-y-1">
        <label class="text-[11px] text-neutral-400">主標題：</label>
        <input id="inputTitle" type="text" value="直播即將開始" class="w-full bg-neutral-800 border border-neutral-700 rounded px-2 py-1 text-white focus:outline-none focus:border-red-500">
      </div>

      <div class="space-y-1">
        <label class="text-[11px] text-neutral-400">副標題：</label>
        <input id="inputSub" type="text" value="STREAM STARTING SOON" class="w-full bg-neutral-800 border border-neutral-700 rounded px-2 py-1 text-white focus:outline-none focus:border-red-500">
      </div>

      <div class="space-y-1">
        <label class="text-[11px] text-neutral-400">時鐘模式：</label>
        <select id="modeSelect" class="w-full bg-neutral-800 border border-neutral-700 rounded px-2 py-1 text-white focus:outline-none">
          <option value="clock">目前時間 (當地即時)</option>
          <option value="countdown5">開播倒數 (5分鐘)</option>
          <option value="countdown10">開播倒數 (10分鐘)</option>
          <option value="hide">隱藏時間模組</option>
        </select>
      </div>

      <p class="text-[10px] text-neutral-400 leading-tight">
        * 放入 OBS 的「瀏覽器來源」解析度建議設為 1920x1080。
      </p>
    </div>
  </div>

  <script>
    // --- 粒子流動系統 (Canvas Particles) ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let width = 0;
    let height = 0;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = height + Math.random() * 50;
        this.size = Math.random() * 2.5 + 0.8;
        this.speedY = Math.random() * 0.7 + 0.25;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.maxAlpha = this.alpha;
        this.hue = Math.random() > 0.35 ? Math.random() * 20 + 350 : 45; // 紅色與微金色
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX + Math.sin(this.y * 0.01) * 0.3;
        if (this.y < height * 0.2) {
          this.alpha -= 0.003;
        }
        if (this.y < -10 || this.alpha <= 0) {
          this.reset();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 90%, 65%, ${this.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsla(${this.hue}, 90%, 60%, ${this.alpha})`;
        ctx.fill();
      }
    }

    const particleCount = Math.min(80, Math.floor(window.innerWidth / 20));
    for (let i = 0; i < particleCount; i++) {
      const p = new Particle();
      p.y = Math.random() * height; // 初始均勻分佈
      particles.push(p);
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // --- 即時時鐘與倒數計時邏輯 ---
    const displayClock = document.getElementById('displayClock');
    const timeContainer = document.getElementById('timeContainer');
    const modeSelect = document.getElementById('modeSelect');
    let countdownRemaining = 300;
    let timerInterval = null;

    function formatTime(val) {
      return String(val).padStart(2, '0');
    }

    function updateTimer() {
      const mode = modeSelect.value;
      if (mode === 'hide') {
        timeContainer.style.display = 'none';
        return;
      }
      timeContainer.style.display = 'flex';

      if (mode === 'clock') {
        const now = new Date();
        displayClock.textContent = `${formatTime(now.getHours())}:${formatTime(now.getMinutes())}:${formatTime(now.getSeconds())}`;
      } else {
        if (countdownRemaining > 0) {
          countdownRemaining--;
        }
        const m = Math.floor(countdownRemaining / 60);
        const s = countdownRemaining % 60;
        displayClock.textContent = `開播倒數 ${formatTime(m)}:${formatTime(s)}`;
      }
    }

    modeSelect.addEventListener('change', () => {
      if (modeSelect.value === 'countdown5') countdownRemaining = 300;
      if (modeSelect.value === 'countdown10') countdownRemaining = 600;
      updateTimer();
    });

    setInterval(updateTimer, 1000);
    updateTimer();

    // --- 自訂文字及全螢幕綁定 ---
    const inputTitle = document.getElementById('inputTitle');
    const inputSub = document.getElementById('inputSub');
    const mainTitle = document.getElementById('mainTitle');
    const subTitle = document.getElementById('subTitle');

    inputTitle.addEventListener('input', (e) => {
      mainTitle.textContent = e.target.value || '直播即將開始';
    });

    inputSub.addEventListener('input', (e) => {
      subTitle.textContent = e.target.value || 'STREAM STARTING SOON';
    });

    document.getElementById('toggleFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // 鍵盤按下 H 鍵可切換控制面板（平時完全隱藏）
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName !== 'INPUT' && (e.key === 'h' || e.key === 'H')) {
        const panel = document.getElementById('controlPanel');
        panel.classList.toggle('hidden');
      }
    });
  </script>
</body>
</html>
