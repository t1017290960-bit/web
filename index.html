<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>救世軍 直播待機畫面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Montserrat:wght@300;400;500&display=swap');
    
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 18% 45%, #6a0d15 0%, #2f0408 35%, #18191d 65%, #111215 100%);
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      font-family: 'Montserrat', sans-serif;
    }

    /* 雙盾核心強烈暖金背光 */
    .golden-core-glow {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 580px;
      height: 380px;
      background: radial-gradient(ellipse at center, rgba(255, 210, 130, 0.45) 0%, rgba(230, 100, 40, 0.28) 40%, rgba(180, 20, 20, 0.12) 65%, transparent 80%);
      filter: blur(45px);
      pointer-events-none;
      animation: pulseGlow 6s ease-in-out infinite alternate;
      z-index: 2;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.85; transform: translate(-50%, -50%) scale(0.96); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* 絲綢波浪畫布 */
    #waveCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events-none;
    }

    /* 雙盾懸浮微光 */
    .shield-float {
      filter: drop-shadow(0 0 25px rgba(255, 170, 70, 0.55)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.7));
      animation: gentleFloat 7s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
  </style>
</head>
<body class="relative flex items-center justify-center">

  <!-- 暖金色核心發光層 -->
  <div class="golden-core-glow"></div>

  <!-- 優雅絲綢動態波浪 Canvas -->
  <canvas id="waveCanvas"></canvas>

  <!-- 內容舞台 (精準 1:1 還原典雅設計) -->
  <main class="relative z-10 flex flex-col items-center justify-center text-center px-4 max-w-4xl select-none">
    
    <!-- 救世軍雙盾 (優先讀取 GitHub 倉庫中的「雙紅盾(去底版).png」) -->
    <div class="relative mb-6 shield-float flex items-center justify-center">
      <img 
        id="posterImg" 
        src="./雙紅盾(去底版).png" 
        alt="救世軍 The Salvation Army" 
        class="h-44 sm:h-52 md:h-60 object-contain drop-shadow-2xl"
        onerror="if(decodeURIComponent(this.src).includes('雙紅盾')){ this.src = './poster.png'; } else { this.style.display='none'; document.getElementById('vectorShield').style.display='block'; }"
      />

      <svg id="vectorShield" style="display: none;" class="w-64 h-64 sm:w-72 sm:h-72 md:w-80 md:h-80 drop-shadow-2xl" viewBox="0 0 520 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.8"/>
          </filter>
          <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#eb2131"/>
            <stop offset="60%" stop-color="#c9101f"/>
            <stop offset="100%" stop-color="#8b0914"/>
          </linearGradient>
        </defs>

        <!-- 右盾牌 (救世軍) -->
        <g transform="translate(195, 115) scale(0.92)" filter="url(#shieldShadow)">
          <path d="M150 15 C105 40 45 35 15 25 C10 80 12 170 45 235 C80 300 135 335 150 345 C165 335 220 300 255 235 C288 170 290 80 285 25 C255 35 195 40 150 15 Z" 
                fill="url(#shieldRed)" stroke="#ffffff" stroke-width="13" stroke-linejoin="round"/>
          <path d="M150 26 C110 47 55 43 27 35 C23 84 25 166 54 226 C85 286 136 319 150 328 C164 319 215 286 246 226 C275 166 277 84 273 35 C245 43 190 47 150 26 Z" 
                fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.95"/>
          <text x="150" y="118" font-family="'Noto Serif TC', serif" font-weight="900" font-size="68" fill="#ffffff" text-anchor="middle">救</text>
          <text x="150" y="206" font-family="'Noto Serif TC', serif" font-weight="900" font-size="68" fill="#ffffff" text-anchor="middle">世</text>
          <text x="150" y="294" font-family="'Noto Serif TC', serif" font-weight="900" font-size="68" fill="#ffffff" text-anchor="middle">軍</text>
        </g>

        <!-- 左盾牌 (THE SALVATION ARMY) -->
        <g transform="translate(25, 25) rotate(-6 150 180)" filter="url(#shieldShadow)">
          <path d="M150 15 C105 40 45 35 15 25 C10 80 12 170 45 235 C80 300 135 335 150 345 C165 335 220 300 255 235 C288 170 290 80 285 25 C255 35 195 40 150 15 Z" 
                fill="url(#shieldRed)" stroke="#ffffff" stroke-width="13" stroke-linejoin="round"/>
          <path d="M150 26 C110 47 55 43 27 35 C23 84 25 166 54 226 C85 286 136 319 150 328 C164 319 215 286 246 226 C275 166 277 84 273 35 C245 43 190 47 150 26 Z" 
                fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.95"/>
          <g transform="rotate(-10 150 180)">
            <text x="150" y="112" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="2">THE</text>
            <text x="150" y="178" font-family="'Times New Roman', serif" font-style="italic" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="1">SALVATION</text>
            <text x="150" y="244" font-family="'Times New Roman', serif" font-style="italic" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">ARMY</text>
          </g>
        </g>
      </svg>
    </div>

    <!-- 典雅宋體中英文排版 (與圖片完全一致) -->
    <h1 class="text-4xl sm:text-5xl md:text-6xl font-medium tracking-[0.22em] text-[#f4efe8] drop-shadow-lg" style="font-family: 'Noto Serif TC', serif;">
      直播即將開始
    </h1>

    <p class="text-base sm:text-xl md:text-2xl font-normal tracking-[0.08em] text-[#ded6c9] mt-3 drop-shadow-md">
      Stream Starting Soon
    </p>

  </main>

  <!-- 底部官方標語 -->
  <footer class="absolute bottom-6 z-20 text-xs sm:text-sm text-[#b8ada0]/70 tracking-[0.25em] font-light flex items-center gap-2.5 select-none">
    <span>THE SALVATION ARMY</span>
    <span class="text-red-400/80">•</span>
    <span>救世軍</span>
  </footer>

  <script>
    // --- 絲綢波浪光影系統 (Sleek Flowing Ribbon Waves) ---
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let step = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function drawWave(yOffset, waveHeight, speed, strokeStyle, fillStyle, thickness) {
      ctx.beginPath();
      ctx.moveTo(0, height * 0.7);

      for (let x = 0; x <= width; x += 15) {
        // 多重正弦波疊加，創造極度自然優雅的絲綢弧線
        const angle1 = (x * 0.0018) + (step * speed);
        const angle2 = (x * 0.0035) - (step * speed * 0.6);
        const y = (height * yOffset) + Math.sin(angle1) * waveHeight + Math.cos(angle2) * (waveHeight * 0.4);
        ctx.lineTo(x, y);
      }

      if (fillStyle) {
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
      } else {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = thickness;
        ctx.stroke();
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      step += 0.006;

      // 柔和穿透的右側暗部微光
      const waveGrad1 = ctx.createLinearGradient(0, height * 0.5, width, height * 0.5);
      waveGrad1.addColorStop(0, 'rgba(230, 90, 50, 0.0)');
      waveGrad1.addColorStop(0.35, 'rgba(255, 180, 110, 0.18)');
      waveGrad1.addColorStop(0.65, 'rgba(240, 240, 255, 0.22)');
      waveGrad1.addColorStop(1, 'rgba(180, 190, 210, 0.05)');

      const waveGrad2 = ctx.createLinearGradient(0, height * 0.5, width, height * 0.5);
      waveGrad2.addColorStop(0, 'rgba(180, 20, 20, 0.0)');
      waveGrad2.addColorStop(0.4, 'rgba(255, 200, 140, 0.28)');
      waveGrad2.addColorStop(0.8, 'rgba(255, 255, 255, 0.12)');
      waveGrad2.addColorStop(1, 'rgba(200, 210, 230, 0.0)');

      // 繪製多層絲綢流光光束
      drawWave(0.55, 65, 0.9, waveGrad1, null, 2.5);
      drawWave(0.52, 50, 1.2, waveGrad2, null, 1.8);
      drawWave(0.48, 80, 0.7, 'rgba(255, 255, 255, 0.08)', null, 1.2);
      drawWave(0.58, 40, 1.5, 'rgba(255, 215, 140, 0.12)', null, 2);

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
